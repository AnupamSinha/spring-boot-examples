spring:
  application:
    name: spring-boot-scheduling

  datasource:
    url: jdbc:h2:mem:schedulingdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  sql:
    init:
      mode: always

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

logging:
  level:
    com.anupam.scheduling: DEBUG
    net.javacrumbs.shedlock: DEBUG
