spring:
  application:
    name: spring-boot-caching

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 2

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=60s

server:
  port: 8080

logging:
  level:
    com.anupam.caching: DEBUG
    org.springframework.cache: TRACE
