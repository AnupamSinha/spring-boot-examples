gatling {
  core {
    runDescription = "Spring Boot Load Test"
    encoding = "utf-8"
    simulationClass = "simulations.ProductApiSimulation"
  }
  http {
    fetchedCssCacheMaxCapacity = 200
    fetchedHtmlCacheMaxCapacity = 200
    perUserCacheMaxCapacity = 200
    warmUpUrl = "http://localhost:8080/api/products"
  }
  data {
    writers = [console, file]
    console {
      light = false
      writePeriod = 5
    }
  }
}
