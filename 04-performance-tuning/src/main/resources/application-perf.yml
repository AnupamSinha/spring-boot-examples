# Production Performance Profile
# Activate with: --spring.profiles.active=perf

spring:
  datasource:
    hikari:
      maximum-pool-size: 30
      minimum-idle: 15
      connection-timeout: 15000
      idle-timeout: 180000
      max-lifetime: 900000
      leak-detection-threshold: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        generate_statistics: false
        default_batch_fetch_size: 32
        query:
          plan_cache_max_size: 2048
          in_clause_parameter_padding: true
    open-in-view: false

  cache:
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=15m,expireAfterAccess=10m,recordStats

server:
  tomcat:
    threads:
      max: 400
      min-spare: 50
    max-connections: 20000
    accept-count: 200
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/json,text/html,text/plain

management:
  endpoint:
    health:
      show-details: never
  metrics:
    export:
      prometheus:
        enabled: true
