services:
  postgres:
    image: postgres:16-alpine
    container_name: cqrs-postgres
    environment:
      POSTGRES_DB: orders_read
      POSTGRES_USER: cqrs_user
      POSTGRES_PASSWORD: cqrs_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongodb:
    image: mongo:7
    container_name: cqrs-mongodb
    environment:
      MONGO_INITDB_DATABASE: event_store
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  postgres_data:
  mongo_data:
