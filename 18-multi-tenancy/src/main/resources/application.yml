spring:
  application:
    name: spring-boot-multi-tenancy

  datasource:
    url: jdbc:postgresql://localhost:5432/multitenant
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080
