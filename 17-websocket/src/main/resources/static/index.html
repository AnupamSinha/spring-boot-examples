<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Chat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; height: 100vh; display: flex; flex-direction: column; }
        .header { background: #2c3e50; color: white; padding: 1rem; text-align: center; }
        .header h1 { font-size: 1.2rem; }
        .connect-form { padding: 1rem; background: white; border-bottom: 1px solid #ddd; display: flex; gap: 0.5rem; align-items: center; }
        .connect-form input { flex: 1; padding: 0.5rem; border: 1px solid #ddd; border-radius: 4px; }
        .connect-form button { padding: 0.5rem 1rem; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; }
        .btn-connect { background: #27ae60; color: white; }
        .btn-disconnect { background: #e74c3c; color: white; }
        .messages { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.5rem; }
        .message { padding: 0.5rem 0.75rem; border-radius: 8px; max-width: 80%; }
        .message.chat { background: white; border: 1px solid #e0e0e0; align-self: flex-start; }
        .message.mine { background: #3498db; color: white; align-self: flex-end; }
        .message.system { background: #ecf0f1; color: #7f8c8d; align-self: center; font-size: 0.85rem; font-style: italic; }
        .message .sender { font-weight: 600; font-size: 0.8rem; margin-bottom: 0.2rem; }
        .message .time { font-size: 0.7rem; opacity: 0.7; margin-top: 0.2rem; }
        .send-form { padding: 1rem; background: white; border-top: 1px solid #ddd; display: flex; gap: 0.5rem; }
        .send-form input { flex: 1; padding: 0.5rem; border: 1px solid #ddd; border-radius: 4px; }
        .send-form button { padding: 0.5rem 1rem; background: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .notification { background: #f39c12; color: white; padding: 0.5rem 0.75rem; border-radius: 8px; align-self: center; font-size: 0.85rem; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="header">
        <h1>WebSocket Chat</h1>
    </div>

    <div class="connect-form" id="connectForm">
        <input type="text" id="username" placeholder="Enter your name..." autofocus>
        <button class="btn-connect" onclick="connect()">Connect</button>
    </div>

    <div class="connect-form hidden" id="connectedBar">
        <span id="connectedAs"></span>
        <button class="btn-disconnect" onclick="disconnect()">Disconnect</button>
    </div>

    <div class="messages" id="messages"></div>

    <div class="send-form hidden" id="sendForm">
        <input type="text" id="messageInput" placeholder="Type a message..." onkeypress="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">Send</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <script>
        let stompClient = null;
        let currentUser = null;

        function connect() {
            const username = document.getElementById('username').value.trim();
            if (!username) return;

            currentUser = username;
            const socket = new SockJS('/ws');
            stompClient = Stomp.over(socket);
            stompClient.debug = null; // disable debug logs

            stompClient.connect({}, function () {
                // Subscribe to chat messages
                stompClient.subscribe('/topic/messages', function (msg) {
                    showMessage(JSON.parse(msg.body));
                });

                // Subscribe to notifications
                stompClient.subscribe('/topic/notifications', function (msg) {
                    showNotification(JSON.parse(msg.body));
                });

                // Send join message
                stompClient.send('/app/chat.join', {}, JSON.stringify({ sender: currentUser, type: 'JOIN' }));

                // Update UI
                document.getElementById('connectForm').classList.add('hidden');
                document.getElementById('connectedBar').classList.remove('hidden');
                document.getElementById('sendForm').classList.remove('hidden');
                document.getElementById('connectedAs').textContent = 'Connected as: ' + currentUser;
            });
        }

        function disconnect() {
            if (stompClient) {
                stompClient.send('/app/chat.leave', {}, JSON.stringify({ sender: currentUser, type: 'LEAVE' }));
                stompClient.disconnect();
            }
            document.getElementById('connectForm').classList.remove('hidden');
            document.getElementById('connectedBar').classList.add('hidden');
            document.getElementById('sendForm').classList.add('hidden');
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const content = input.value.trim();
            if (!content || !stompClient) return;

            stompClient.send('/app/chat', {}, JSON.stringify({
                sender: currentUser,
                content: content,
                type: 'CHAT'
            }));
            input.value = '';
        }

        function showMessage(msg) {
            const messagesDiv = document.getElementById('messages');
            const div = document.createElement('div');

            if (msg.type === 'JOIN' || msg.type === 'LEAVE') {
                div.className = 'message system';
                div.textContent = msg.content;
            } else {
                const isMine = msg.sender === currentUser;
                div.className = 'message ' + (isMine ? 'mine' : 'chat');
                div.innerHTML = (!isMine ? '<div class="sender">' + escapeHtml(msg.sender) + '</div>' : '') +
                    '<div>' + escapeHtml(msg.content) + '</div>' +
                    '<div class="time">' + new Date(msg.timestamp).toLocaleTimeString() + '</div>';
            }

            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function showNotification(notification) {
            const messagesDiv = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = 'notification';
            div.textContent = '🔔 ' + notification.message;
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Connect on Enter in username field
        document.getElementById('username').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') connect();
        });
    </script>
</body>
</html>
